services:
  - type: web
    name: orca-backend
    env: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: orca-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: orca-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: orca-db
          property: password
      - key: AI_V2_SERVICE_URL
        value: https://orca-ai-service.onrender.com
      - key: AI_SERVICE_BASE_URL
        value: https://orca-ai-service.onrender.com

  - type: web
    name: orca-ai-service
    env: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AI_V2_MODE
        value: gemini
      - key: AI_PROVIDER
        value: gemini_api
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_TIMEOUT_SECONDS
        value: "90"
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: orca-forecast-service
    env: python
    rootDir: forecast-service
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BASE_PATH
        value: ""

  - type: web
    name: orca-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: orca-db
    plan: free # Change to starter/standard if needed
    databaseName: orca_db
    user: orca_user
