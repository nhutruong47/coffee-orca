# ===== Database (PostgreSQL trên Neon.tech) =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.use_nationalized_character_data=false
spring.jpa.open-in-view=false

# ===== Flyway Database Migration =====
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration

# ===== JWT =====
app.jwt.secret=${JWT_SECRET:bXlTdXBlclNlY3JldEtleUZvckpXVF9QbGVhc2VDaGFuZ2VJblByb2R1Y3Rpb25fQXRMZWFzdDI1NkJpdHMhIQ==}
app.jwt.expiration=86400000

# ===== Google OAuth2 =====
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:test}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:test}
spring.security.oauth2.client.registration.google.scope=email,profile

# ===== Mail / SMTP =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.test-connection=false
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# ===== Logging & Correlation Tracing =====
logging.pattern.level=%5p [cid:%X{correlationId:-none}]
logging.level.org.example.backend=INFO
logging.level.org.springframework.security=WARN

# ===== Cấu hình Mạng =====
server.port=${PORT:8080}

# ===== Frontend URL (cho OAuth2 redirect) =====
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ===== AI Service =====
ai.service.api-key=${AI_SERVICE_API_KEY:}
ai.service.base-url=${AI_SERVICE_BASE_URL:${AI_V2_SERVICE_URL:https://orca-ai-service.onrender.com}}
ai.v2.service-url=${AI_V2_SERVICE_URL:${AI_SERVICE_BASE_URL:https://orca-ai-service.onrender.com}}

# Fix Neon.tech pgBouncer cached plan error
spring.datasource.hikari.data-source-properties.prepareThreshold=0

